name: Bug report
description: Report reproducible broken behavior
title: 'Bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include secrets or security vulnerabilities. Use the private security-advisory link instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the shortest reliable sequence that triggers the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 128, Chrome 126, Safari 18
    validations:
      required: true
  - type: dropdown
    id: connectivity
    attributes:
      label: Connectivity
      options:
        - Online
        - Offline
        - Happens in both states
        - Unknown
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or console output. Remove private data first.
